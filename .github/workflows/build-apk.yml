name: COMMERZO APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build COMMERZO APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Decode release keystore
        env:
          COMMERZO_KEYSTORE_BASE64: ${{ secrets.COMMERZO_KEYSTORE_BASE64 }}
        run: |
          echo "$COMMERZO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/commerzo-release.jks"

      - name: Get release SHA-1 fingerprint
        env:
          COMMERZO_KEYSTORE_FILE: ${{ runner.temp }}/commerzo-release.jks
          COMMERZO_KEYSTORE_PASSWORD: ${{ secrets.COMMERZO_KEYSTORE_PASSWORD }}
          COMMERZO_KEY_ALIAS: ${{ secrets.COMMERZO_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore "$COMMERZO_KEYSTORE_FILE" \
            -alias "$COMMERZO_KEY_ALIAS" \
            -storepass "$COMMERZO_KEYSTORE_PASSWORD" \
            | grep -E "SHA1:|SHA256:"

      - name: Build signed release APK
        env:
          COMMERZO_KEYSTORE_FILE: ${{ runner.temp }}/commerzo-release.jks
          COMMERZO_KEYSTORE_PASSWORD: ${{ secrets.COMMERZO_KEYSTORE_PASSWORD }}
          COMMERZO_KEY_ALIAS: ${{ secrets.COMMERZO_KEY_ALIAS }}
          COMMERZO_KEY_PASSWORD: ${{ secrets.COMMERZO_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: COMMERZO-release
          path: app/build/outputs/apk/release/app-release.apk
